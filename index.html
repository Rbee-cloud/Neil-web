    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Safeguard against browser extensions (e.g., Urban VPN Proxy) trying to reassign window.fetch
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || !desc.set) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return originalFetch;
              },
              set: function(val) {
                originalFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (
            event &&
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
